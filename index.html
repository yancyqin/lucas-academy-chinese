<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>中文阅读 · Lucas Academy</title>
<link rel="stylesheet" href="css/style.css?v=11">
</head>
<body>

<header class="top">
  <div class="brand">📖 中文阅读<span class="brand-sub">Lucas Academy Chinese</span></div>
  <div class="toggles">
    <label class="toggle" for="pinyin-toggle">
      <input id="pinyin-toggle" type="checkbox">
      <span>拼音</span>
    </label>
    <label class="toggle" for="english-toggle">
      <input id="english-toggle" type="checkbox">
      <span>English · NIV</span>
    </label>
    <label class="toggle" for="dictation-toggle">
      <input id="dictation-toggle" type="checkbox">
      <span>默写 · Dictation</span>
    </label>
  </div>
  <!-- One recording for the whole app: it is kept after the window is closed,
       and a new take replaces it. -->
  <div id="voice" class="voice">
    <button id="voice-record" class="voice-btn" title="Record my reading">🎤 Record</button>
    <button id="voice-play" class="voice-btn" title="Play my recording" hidden>🎧 My reading</button>
    <button id="voice-pause" class="voice-btn pause-btn">⏸ Pause</button>
    <button id="voice-delete" class="voice-btn voice-delete" title="Delete my recording" hidden>🗑 Delete</button>
    <span id="voice-status" class="voice-status"></span>
  </div>
  <nav id="tabs" class="tabs"></nav>
</header>

<div class="layout">
  <main id="content" class="content"></main>
  <aside id="wordbook" class="wordbook" hidden>
    <div class="wordbook-head">
      <h2 class="wordbook-title">生词本 · Wordbook</h2>
      <span id="wordbook-count" class="wordbook-count">0</span>
      <button id="wordbook-minimize" class="wordbook-minimize" type="button" aria-label="Minimize Wordbook" title="Minimize Wordbook">−</button>
    </div>
    <p class="wordbook-sub">老师的生词 + 你标 ⭐ 的词</p>
    <div id="wordbook-list" class="wordbook-list"></div>
  </aside>
</div>

<footer id="bible-credit" class="bible-credit" hidden></footer>

<aside id="panel" class="panel" aria-live="polite">
  <button id="panel-close" class="panel-close" title="Close">✕</button>
  <div class="panel-top">
    <span id="panel-word" class="panel-word"></span>
    <span id="panel-pinyin" class="panel-pinyin"></span>
    <span class="panel-buttons">
      <button id="btn-say" class="say">🔊 Play</button>
      <button id="btn-slow" class="say">🐢 Slower</button>
    </span>
    <span class="panel-buttons panel-mark-buttons">
      <button id="btn-highlight" class="mark-action">⭐ Mark</button>
      <button id="btn-unhighlight" class="mark-action" hidden>✕ Unmark</button>
    </span>
  </div>
  <p id="panel-meaning" class="panel-meaning"></p>
  <p id="panel-usage" class="panel-usage"></p>
  <div class="panel-sentence-row">
    <span class="sentence-buttons">
      <button id="btn-sentence" class="say">🔊 Sentence</button>
      <button id="btn-sentence-slow" class="say">🐢 Slower</button>
      <button id="btn-sentence-pause" class="say pause-btn">⏸ Pause</button>
    </span>
    <span id="panel-sentence" class="panel-sentence"></span>
  </div>
  <div id="panel-english" class="panel-english" hidden>
    <p id="panel-niv-row" class="panel-niv"><span class="en-tag">NIV</span><span id="panel-niv"></span></p>
    <p id="panel-explain" class="panel-explain"></p>
  </div>
</aside>

<script type="module" src="js/app.js?v=17"></script>
</body>
</html>
